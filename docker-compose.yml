services:
  csnu:
    build: .
    image: csnu-checker
    container_name: csnu-checker
    restart: unless-stopped
    ports:
      - "80:7860"
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
